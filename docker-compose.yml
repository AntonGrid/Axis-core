# Docker Compose stack for Axis Core (reference implementation).
#
# NOTE: this file requires Docker Compose v2 (`docker compose`). If the v2 plugin
# is not installed on your system, run `docker compose version` to confirm, or
# install Docker Compose v2 before using `docker compose up --build`.
services:
  axis-core:
    build: .
    image: axis-core:latest
    ports:
      - "8000:8000"
    environment:
      # Dev-only mock signatures are OFF by default.
      - AXIS_ALLOW_MOCK=${AXIS_ALLOW_MOCK:-}
      # Required in strict mode: Base64-encoded 32-byte Ed25519 seed. Without
      # it (and without AXIS_ALLOW_MOCK) the oracle rejects attestation with 503.
      - ORACLE_SECRET_KEY=${ORACLE_SECRET_KEY:-}
      # Storage backend: memory (default) | redis | postgres | hybrid.
      # Requires requirements-storage.txt and the services below.
      - AXIS_STORAGE_BACKEND=${AXIS_STORAGE_BACKEND:-memory}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - DATABASE_URL=${DATABASE_URL:-postgresql://axis:axis@postgres:5432/axis}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: axis
      POSTGRES_PASSWORD: axis
      POSTGRES_DB: axis
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U axis"]
      interval: 5s
      timeout: 3s
      retries: 10

  registry:
    build: ./oracle/registry
    image: axis-manifest-registry:latest
    ports:
      - "4000:4000"
    environment:
      # Required. The registry exits if this is unset (see oracle/registry/README.md).
      - REGISTRY_ADMIN_KEY=${REGISTRY_ADMIN_KEY:-}
