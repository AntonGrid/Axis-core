[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "axis-core"
version = "0.1.0"
description = "Universal reference implementation of the Axis Protocol — domain- and platform-agnostic trust standard"
readme = "README.md"
authors = [
    { name = "Anton Gridnev", email = "antongrid@example.com" },
]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2.0",
    "jsonschema>=4.0",
    "httpx>=0.24",
    "pycryptodome>=3.15",
    "PyNaCl>=1.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "anyio>=4.0",
]

[project.urls]
Homepage = "https://github.com/AntonGrid/Axis-core"
Repository = "https://github.com/AntonGrid/Axis-core.git"

[tool.setuptools.packages.find]
include = ["axis_core", "axis_core.*", "oracle", "oracle.*", "sdk", "sdk.*"]
exclude = ["tests", "tests.*", "scripts", "scripts.*", "docs", "docs.*"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.yaml", "*.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
